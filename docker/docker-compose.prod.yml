# docker/docker-compose.prod.yml — 生产覆盖层，不单独使用
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# 作用：把只该被同机进程访问的数据端口收口到回环地址，并去掉开发期便利配置。
# 基础文件把端口发布到 0.0.0.0，在公网服务器上等于把 PostgreSQL、Elasticsearch、
# RabbitMQ（含 15672 管理台）直接摆到全网扫描器面前。后端与 nginx 都跑在宿主机，
# 走 127.0.0.1 完全够用；确实要从本机之外访问时，用 SSH 端口转发，不要改这里：
#
#   ssh -L 15672:127.0.0.1:15672 user@server
#
# ports / volumes 用 !override 而非直接列举：Compose 对这两个多值字段默认是
# 「追加合并」，只写新值会得到新旧并存的结果（端口重复发布直接启动失败，
# 源码挂载也删不掉）。!override 表示整段替换基础文件里的值。

services:
  postgres:
    ports: !override
      - "127.0.0.1:5434:5432"

  ai-service:
    ports: !override
      - "127.0.0.1:8001:8001"
    # 必须挂载源码：镜像并未打包 app/ —— Dockerfile 的构建上下文是 docker/python，
    # 里面只有 Dockerfile 和 requirements.txt，COPY 也只复制了 requirements.txt。
    # 之前这里写 volumes: !override [] 是误以为「源码已构建进镜像」，实际删掉挂载后
    # uvicorn 找不到 app.main，容器 exit 1 崩溃重启。代码经 archive+scp 落在
    # /opt/komo/KOMO/ai-service，与后端 JAR、前端 standalone 同源；:ro 防容器内改写。
    # （真正的「源码打进镜像」需重构构建上下文 + Dockerfile COPY，挂账 Beta 后。）
    volumes: !override
      - ../KOMO/ai-service:/app:ro
    # 去掉 --reload：文件监视器在生产是白占内存，还会在文件变动时自行重启
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001

  rabbitmq:
    ports: !override
      - "127.0.0.1:5672:5672"   # AMQP，仅本机后端连接
    # 15672 管理台不发布到任何地址，需要时用上面的 SSH 转发临时看

  elasticsearch:
    # docker.elastic.co 在国内不可达，而 registry-mirrors 只加速 docker.io，
    # 对它无效。Docker Hub 的 library/elasticsearch 是 Elastic 官方同源镜像
    # （同 tag 同内容），改走 Hub 才能吃到加速器。image 是标量字段，
    # 直接写就是覆盖基础文件的值，不需要 !override。
    image: elasticsearch:8.12.0
    ports: !override
      - "127.0.0.1:9201:9200"
