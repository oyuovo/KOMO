[package]
name = "komo-desktop"
version = "0.1.0"
description = "KOMO desktop client (Knowledge On My Own)"
authors = ["KOMO"]
edition = "2021"
rust-version = "1.77"

# The lib crate exposes `run()` so the mobile/desktop entry points stay thin.
[lib]
name = "komo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
