# KOMO Nginx 站点配置（方案 C：境外免备案 + Let's Encrypt HTTPS）
# 安装：
#   sudo cp deploy/nginx-komo.conf /etc/nginx/sites-available/komo
#   sudo sed -i 's/komo.example.com/<生产域名>/g' /etc/nginx/sites-available/komo
#   sudo ln -s /etc/nginx/sites-available/komo /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d <生产域名>   # certbot 会自动改写 ssl 配置
#
# ⚠️ 两个不要动的配置（动了线上必炸，本地无法复现）：
#   1. proxy_buffering off —— 删了 SSE 流式就废（AI 回复憋数秒整段出现）
#   2. X-Forwarded-For $remote_addr —— 用 $proxy_add_x_forwarded_for（追加）
#      会让客户端伪造转发头绕过登录限流；后端 RateLimitFilter 依赖"覆盖"语义

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name komo.example.com;
    return 301 https://$host$request_uri;
}

# HTTPS 主配置
server {
    listen 443 ssl http2;
    server_name komo.example.com;

    # SSL 证书（certbot 自动管理）
    ssl_certificate     /etc/letsencrypt/live/komo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/komo.example.com/privkey.pem;

    # 安全头
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;

    client_max_body_size 5M;

    # 前端（Next.js）
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖而非追加 —— 后端限流取最右一跳，追加会让伪造头错位
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # 后端 API（含 SSE）
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # 同上：覆盖而非追加
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';

        proxy_read_timeout 180s;   # SSE 长连接（后端 async request-timeout 同为 180s）
        proxy_send_timeout 180s;

        # ⚠️ SSE 必需，勿删。nginx 默认缓冲上游响应，
        # 不关闭的话 AI 回复不再逐字流出，而是憋数秒后整段一次性出现。
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
    }
}
