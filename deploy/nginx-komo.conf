# KOMO Nginx 站点配置（方案 D：境内备案 + Let's Encrypt HTTPS，生产域名 9any.cn）
# 域名已烤进本文件（9any.cn），scp 上去后无需再 sed 替换。
# 安装：
#   sudo cp deploy/nginx-komo.conf /etc/nginx/sites-available/komo
#   sudo ln -sf /etc/nginx/sites-available/komo /etc/nginx/sites-enabled/komo
#   sudo rm -f /etc/nginx/sites-enabled/default
#   ⚠️ 证书签发前，下面 443 块的 ssl_certificate 文件不存在，直接 nginx -t 会失败；
#      且 80 块的 301 跳转会干扰 certbot 的 HTTP-01 验证。故首次签发用 --standalone（临时独占 80）：
#   sudo systemctl stop nginx
#   sudo certbot certonly --standalone -d 9any.cn
#   sudo nginx -t && sudo systemctl start nginx
#   证书 90 天到期，certbot 会装自动续期 timer；续期同样需短暂停 nginx，给它加钩子：
#   在 /etc/letsencrypt/cli.ini 或续期命令里配 --pre-hook "systemctl stop nginx" --post-hook "systemctl start nginx"
#
# ⚠️ 两个不要动的配置（动了线上必炸，本地无法复现）：
#   1. proxy_buffering off —— 删了 SSE 流式就废（AI 回复憋数秒整段出现）
#   2. X-Forwarded-For $remote_addr —— 用 $proxy_add_x_forwarded_for（追加）
#      会让客户端伪造转发头绕过登录限流；后端 RateLimitFilter 依赖"覆盖"语义

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name 9any.cn;
    return 301 https://$host$request_uri;
}

# HTTPS 主配置
server {
    listen 443 ssl http2;
    server_name 9any.cn;

    # SSL 证书（certbot 自动管理）
    ssl_certificate     /etc/letsencrypt/live/9any.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/9any.cn/privkey.pem;

    # 安全头
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;

    client_max_body_size 5M;

    # 前端（Next.js）
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖而非追加 —— 后端限流取最右一跳，追加会让伪造头错位
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # 后端 API（含 SSE）
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # 同上：覆盖而非追加
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';

        proxy_read_timeout 180s;   # SSE 长连接（后端 async request-timeout 同为 180s）
        proxy_send_timeout 180s;

        # ⚠️ SSE 必需，勿删。nginx 默认缓冲上游响应，
        # 不关闭的话 AI 回复不再逐字流出，而是憋数秒后整段一次性出现。
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
    }
}
