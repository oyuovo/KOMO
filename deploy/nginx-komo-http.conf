# KOMO Nginx 站点配置 —— HTTP-only 反向代理（备案前验证专用）
#
# 用途：域名/备案/HTTPS 就绪前，先用纯 HTTP 把 nginx → 前端(3000) → 后端(8081，含 SSE)
#       整条链路在服务器上跑通并自测。备案下来后改用 deploy/nginx-komo.conf（443/SSL +
#       80→443 跳转 + 域名），本文件作废。
#
# 怎么自测（关键）：后端 COOKIE_SECURE=true，登录 cookie 带 Secure，只在 HTTPS 或 localhost
#   下才存得住。所以别指望用 http://<公网IP> 登录（cookie 存不住、登不进去，只能看到登录页，
#   证明部署通而已）。要真正登录 + 测 SSE，用 SSH 隧道把服务器 80 投到本地 localhost：
#     ssh -L 8080:localhost:80 ubuntu@<服务器IP>    # 然后浏览器开 http://localhost:8080
#   localhost 是浏览器认可的安全上下文，Secure cookie 可用，登录 + 发消息看逐字流出全都能测。
#
# 安装：
#   sudo cp deploy/nginx-komo-http.conf /etc/nginx/sites-available/komo-http
#   sudo ln -sf /etc/nginx/sites-available/komo-http /etc/nginx/sites-enabled/komo-http
#   sudo rm -f /etc/nginx/sites-enabled/default      # 去掉默认欢迎页，避免 default_server 冲突
#   sudo nginx -t && sudo systemctl reload nginx
#
# ⚠️ 两个不要动的配置（与 nginx-komo.conf 一致，动了线上必炸、本地难复现）：
#   1. proxy_buffering off —— 删了 SSE 流式就废（AI 回复憋数秒整段出现）
#   2. X-Forwarded-For $remote_addr —— 覆盖而非追加；用 $proxy_add_x_forwarded_for 会让
#      客户端伪造转发头绕过登录限流（后端 RateLimitFilter 依赖“覆盖”语义）
#
# 静态资源不单独 alias：Next.js standalone 自己以 immutable 缓存头提供 /_next/static/ 与 public/，
#   且本机是「本地构建 + 只 scp standalone」，服务器没有顶层 .next/static/，alias 反而指空。

server {
    listen 80 default_server;
    server_name _;

    # 明文 HTTP 下 HSTS 无意义（浏览器会忽略），故只保留这两个安全头；HTTPS 版才加 HSTS
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;

    client_max_body_size 5M;

    # 前端（Next.js standalone，静态资源也走这里由 node 提供）
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # 覆盖而非追加，防伪造头绕过限流
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # 后端 API（含 SSE 流式）
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # 同上：覆盖而非追加
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';

        proxy_read_timeout 180s;   # SSE 长连接（后端 async timeout 亦为 180s）
        proxy_send_timeout 180s;
        proxy_buffering off;       # ⚠️ SSE 必需，勿删；否则 AI 回复憋数秒整段出现
        proxy_cache off;
        chunked_transfer_encoding off;
    }
}
